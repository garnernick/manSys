<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sentiment</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12203A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080E1B" media="(prefers-color-scheme: dark)">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { color-scheme: light dark;
  --bg:#F2F1ED; --card:#FFFFFF; --card2:#E7E5DD; --line:#E0DDD3; --edge:#C8C4B8; --ink:#12203A; --muted:#565F73;
  --top:#12203A; --top-ink:#D9DFEC; --brand:#FFC24B; --pill:#12203A; --pill-ink:#FFC24B; --field:#F7F6F2; --shadow:0 1px 2px rgba(20,20,19,.07), 0 6px 18px rgba(18,32,58,.05);
  --ok-bg:#E3F5E9; --ok-ink:#1B6B3A; --ok-edge:#BFE3CC; --warn-bg:#FFF1D6; --warn-ink:#7A4B00; --warn-edge:#F2DCA8;
  --bad-bg:#FDE8E6; --bad-ink:#8A1C12; --bad-edge:#F2C9C4; --info-bg:#E3E9F7; --info-ink:#2A4FA8;
  --font:'Inter',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; }
@media (prefers-color-scheme: dark) { :root {
  --bg:#0C1424; --card:#15203A; --card2:#1E2B48; --line:#26345A; --edge:#3A4A74; --ink:#EAEEF7; --muted:#A6B0C6; --top:#080E1B; --top-ink:#A6B0C6; --pill:#FFC24B; --pill-ink:#1A1200; --field:#0F1930; --shadow:0 0 0 1px var(--line);
  --ok-bg:#12301E; --ok-ink:#6DE39A; --ok-edge:#1F4A31; --warn-bg:#3A2C0E; --warn-ink:#FFC66B; --warn-edge:#5A4519;
  --bad-bg:#3A1714; --bad-ink:#FFB3AB; --bad-edge:#5A2622; --info-bg:#172A52; --info-ink:#9DB8FF; } }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%; }
.top { background:var(--top); color:var(--top-ink); padding:calc(10px + env(safe-area-inset-top,0px)) 18px 10px; display:flex; justify-content:space-between; align-items:center; font:500 11px var(--mono); letter-spacing:.1em; text-transform:uppercase; }
.top b { color:var(--brand); letter-spacing:.16em; font-weight:500; font-size:12px; }
.nav { max-width:1180px; margin:0 auto; padding:14px 20px 0; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.nav a { text-decoration:none; color:var(--muted); font-weight:500; font-size:14px; padding:9px 16px; border-radius:999px; background:var(--card); border:1px solid var(--line); min-height:40px; display:inline-flex; align-items:center; }
.nav a.on { background:var(--pill); color:var(--pill-ink); border-color:var(--pill); }
@media (max-width:600px) { .nav .today { display:none; } }
.nav .today { margin-left:auto; font:400 12px var(--mono); color:var(--muted); }
main { max-width:1180px; margin:0 auto; padding:14px 20px 140px; }
h1 { font-size:32px; font-weight:700; letter-spacing:-.025em; line-height:1.12; margin-top:6px; }
h1 .chip { font-size:11px; margin-left:12px; position:relative; top:-5px; }
h2 { font:500 11px var(--mono); text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:28px 0 8px 4px; }
.sub { color:var(--muted); font-size:14px; margin-top:4px; }
a.back { font-size:14px; color:var(--muted); text-decoration:none; display:inline-block; padding:6px 0; }
.card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px 18px; margin:10px 0; box-shadow:var(--shadow); }
.card h3 { font-size:16px; font-weight:600; letter-spacing:-.005em; }
.list a.card { display:block; text-decoration:none; color:var(--ink); transition:background .12s; }
.list a.card:active { background:var(--card2); }
.list a.card h3 { display:flex; align-items:center; gap:10px; justify-content:space-between; }
.chip { display:inline-block; font:500 10.5px var(--mono); letter-spacing:.02em; padding:3px 10px; border-radius:999px; background:var(--warn-bg); color:var(--warn-ink); border:1px solid var(--warn-edge); margin-left:8px; vertical-align:middle; white-space:nowrap; }
.chip.done { background:var(--ok-bg); color:var(--ok-ink); border-color:var(--ok-edge); }
.chip.kind { background:var(--field); color:var(--muted); border:1px solid var(--line); }
.summary { white-space:pre-wrap; font-size:15px; line-height:1.55; }
.quote { font-style:normal; color:var(--muted); font-size:14px; margin:8px 0; border-left:3px solid var(--brand); padding:2px 0 2px 12px; }
.dupe { background:var(--warn-bg); color:var(--warn-ink); border:1px solid var(--warn-edge); border-radius:12px; padding:10px 12px; margin:10px 0; font-size:13px; }
label.f { display:block; font:500 10.5px var(--mono); letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:12px 0 5px 2px; }
input[type=text], input[type=date], select, textarea { width:100%; border:1px solid var(--line); border-radius:12px; background:var(--field); color:var(--ink); font:inherit; font-size:16px; padding:11px 12px; min-height:46px; }
input:focus, select:focus, textarea:focus { outline:2px solid var(--brand); outline-offset:1px; border-color:transparent; }
textarea { min-height:72px; resize:vertical; line-height:1.4; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.dec { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
.dec label { border:1px solid var(--line); border-radius:999px; padding:10px 16px; font-size:14px; font-weight:500; cursor:pointer; background:var(--card); min-height:42px; display:inline-flex; align-items:center; }
.dec input { display:none; }
.dec label:has(input:checked) { background:var(--pill); color:var(--pill-ink); border-color:var(--pill); font-weight:600; }
.dec label:has(input[value=approve]:checked) { background:var(--ok-ink); color:#fff; border-color:var(--ok-ink); }
.dec label:has(input[value=reject]:checked) { background:var(--bad-bg); color:var(--bad-ink); border-color:var(--bad-ink); }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px; font-size:14px; }
.row input[type=checkbox] { width:20px; height:20px; accent-color:var(--pill); }
button { font:inherit; font-size:14px; font-weight:500; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:12px; padding:9px 14px; cursor:pointer; min-height:42px; }
button:active { background:var(--card2); }
.bar { position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); background:var(--card); border:1px solid var(--line); border-radius:20px; padding:10px 12px 10px 18px; box-shadow:0 12px 36px rgba(18,32,58,.22); max-width:1140px; margin:0 auto; z-index:20; }
.bar .in { display:flex; gap:12px; align-items:center; }
.bar .msg { flex:1; font-size:13px; color:var(--muted); }
button.go { background:var(--pill); color:var(--pill-ink); border-color:var(--pill); font-weight:600; padding:11px 22px; border-radius:14px; min-height:46px; }
button.go[disabled] { opacity:.45; }
.msg.ok { color:var(--ok-ink); font-weight:600; } .msg.err { color:var(--bad-ink); font-weight:600; }
.gate { max-width:380px; margin:70px auto; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:24px; padding:30px 24px; box-shadow:var(--shadow); }
.gate input { font-size:22px; padding:12px; text-align:center; margin:16px 0; letter-spacing:.3em; }
.gate button.go { width:100%; }
.empty { color:var(--muted); text-align:center; padding:48px 0; }
.err-box { background:var(--bad-bg); color:var(--bad-ink); border:1px solid var(--bad-edge); border-radius:14px; padding:10px 14px; margin:14px 0; font-size:14px; }
.big { font:500 34px var(--mono); letter-spacing:-.03em; line-height:1; }
.delta.up { color:var(--ok-ink); } .delta.down { color:var(--bad-ink); } .delta { font-size:13px; font-weight:600; margin-left:6px; }
.spark { display:block; margin-top:6px; }
.traj { display:inline-block; font:500 11.5px var(--mono); border-radius:999px; padding:4px 12px; margin-top:10px; border:1px solid transparent; }
.traj.up { background:var(--ok-bg); color:var(--ok-ink); border-color:var(--ok-edge); } .traj.down { background:var(--bad-bg); color:var(--bad-ink); border-color:var(--bad-edge); } .traj.flat { background:var(--field); color:var(--muted); border-color:var(--line); }
.spark30 { width:100%; height:auto; display:block; margin-top:10px; color:var(--muted); }
.spark30.up { color:var(--ok-ink); } .spark30.down { color:var(--bad-ink); }
.arrow { font-size:13px; margin-left:8px; vertical-align:1px; }
.arrow.up { color:var(--ok-ink); } .arrow.down { color:var(--bad-ink); } .arrow.flat { color:var(--muted); }
.two { display:flex; justify-content:space-between; gap:14px; align-items:flex-start; }
.small { font-size:12.5px; color:var(--muted); }
.small a { color:var(--info-ink); font-weight:500; }
table.t { width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
table.t th { font:500 10.5px var(--mono); letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
table.t td, table.t th { text-align:left; padding:8px 10px 8px 0; border-bottom:1px solid var(--line); vertical-align:top; }
table.t tr:last-child td { border-bottom:0; }
.note { background:var(--warn-bg); color:var(--warn-ink); border:1px solid var(--warn-edge); border-radius:14px; padding:10px 14px; margin:12px 0; font-size:13px; }
.dgrid, .cards2 { display:block; }
@media (min-width:900px) {
  .dgrid { display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); gap:0 22px; align-items:start; }
  .cards2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 16px; align-items:start; }
  .bar { left:24px; right:24px; }
}
</style></head>
<body>
<div class="top"><b>MANSYS</b><span>Sentiment</span></div>
<div class="nav"><a href="#" onclick="history.length > 1 ? history.back() : (location.href = 'dashboard-mobile-push.html'); return false;">‹ Dashboard</a><a href="recordingreview.html">Recordings</a><a href="sentiment.html" class="on">Sentiment</a><span class="today" id="today"></span></div>
<script>document.getElementById("today").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",timeZone:"Europe/London"});</script>
<main id="root"></main>
<script>
const FN_URL = 'https://dglotzmioswcmhfttcqx.supabase.co/functions/v1/sentimentview';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const fmtD = d => d ? new Date(d).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric', timeZone:'Europe/London' }) : 'Date unknown';
const SUBJ = { toward_nick:'Toward you', own_state:'Your own mood', call_overall:'Whole call' };
async function call(body) {
  const r = await fetch(FN_URL, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error(j.error || ('HTTP ' + r.status)); err.code = j.error; throw err; }
  return j;
}
function gate(msg) {
  $('root').innerHTML = '<div class="gate"><h1>Sentiment</h1><div class="sub">Enter your PIN</div>' + (msg ? '<div class="err-box">' + esc(msg) + '</div>' : '') +
    '<input id="pin" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false"><button class="go" id="pinGo">Open</button></div>';
  const go = () => { const v = $('pin').value.trim(); if (v) { store.set('mansys_review_pin', v); start(); } };
  $('pinGo').onclick = go; $('pin').onkeydown = e => { if (e.key === 'Enter') go(); };
}
function fail(e) {
  if (e.code === 'bad_pin') { store.del('mansys_review_pin'); return gate('That PIN is not right.'); }
  if (e.code === 'locked') return gate('Too many wrong attempts. Try again in 15 minutes.');
  $('root').innerHTML = '<div class="empty">Could not load. Try again shortly.</div>';
}
const SRC = { nick:'something you said or did', topic:'the subject matter', other_person:'another person on the call', external:'something outside the call', none:'no clear cause' };
// Provisional thresholds: score movement of this size or more is flagged. They are not calibrated; scores can wobble between runs.
const FLAG = 10;
const TREND = 5; // provisional: points of difference for the 7-day arrow, not calibrated
const DAY = 86400000;
function delta(score, base) {
  if (base == null) return '<span class="small"> no earlier calls to compare</span>';
  const d = score - base;
  if (Math.abs(d) < FLAG) return '<span class="small"> steady vs usual (' + base + ')</span>';
  return '<span class="delta ' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? 'Up ' : 'Down ') + Math.abs(d) + ' vs usual (' + base + ')</span>';
}
function inCall(s0, s1) {
  if (s0 == null || s1 == null) return '';
  const d = s1 - s0;
  return '<div class="small">During the call: ' + s0 + ' → ' + s1 + (Math.abs(d) >= FLAG ? (d > 0 ? ' (warmed)' : ' (cooled)') : ' (steady)') + '</div>';
}
function spark(vals) {
  if (!vals || vals.length < 2) return '';
  const w = 160, h = 32, n = vals.length;
  const pts = vals.map((v, i) => (i * (w - 4) / (n - 1) + 2).toFixed(1) + ',' + (h - 2 - (Math.max(0, Math.min(100, v)) / 100) * (h - 4)).toFixed(1)).join(' ');
  return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-label="Trend, oldest to newest"><polyline fill="none" stroke="currentColor" stroke-width="2" points="' + pts + '"/></svg>';
}

function trendOf(ser) {
  const now = Date.now();
  const pts = (ser || []).map(o => ({ t: Date.parse(o.d), s: o.s }));
  const recent = pts.filter(o => o.t >= now - 7 * DAY);
  const earlier = pts.filter(o => o.t < now - 7 * DAY);
  const avg = a => a.reduce((x, o) => x + o.s, 0) / a.length;
  if (!recent.length) return { dir: 'flat', text: 'No reading in the last 7 days' };
  if (!earlier.length) {
    // No earlier reading to compare with: use where the score sits against 50 (neutral) as the direction. This is a level, not a change.
    const m = Math.round(avg(recent)), d0 = m - 50;
    const note = '; no earlier reading yet, so this shows level, not change';
    if (d0 >= TREND) return { dir: 'up', text: 'Above neutral (' + m + ' vs 50)' + note };
    if (d0 <= -TREND) return { dir: 'down', text: 'Below neutral (' + m + ' vs 50)' + note };
    return { dir: 'flat', text: 'Around neutral (' + m + ' vs 50)' + note };
  }
  const d = Math.round(avg(recent) - avg(earlier));
  if (d >= TREND) return { dir: 'up', text: 'Up ' + d + ' over the last 7 days' };
  if (d <= -TREND) return { dir: 'down', text: 'Down ' + Math.abs(d) + ' over the last 7 days' };
  return { dir: 'flat', text: 'Flat over the last 7 days (' + (d > 0 ? '+' : '') + d + ')' };
}
const ARROW = { up: '&#9650;', down: '&#9660;', flat: '&#9644;' };
function trajectory(ser) { const t = trendOf(ser); return '<span class="traj ' + t.dir + '">' + ARROW[t.dir] + ' ' + t.text + '</span>'; }
function nameArrow(ser) { const t = trendOf(ser); return '<span class="arrow ' + t.dir + '" role="img" aria-label="' + t.text + '" title="' + t.text + '">' + ARROW[t.dir] + '</span>'; }
function spark30(ser) {
  const dir = trendOf(ser).dir;
  const now = Date.now(), t0 = now - 30 * DAY, w = 300, h = 64, px = 6, py = 6;
  const pts = (ser || []).map(o => ({ t: Date.parse(o.d), s: o.s })).filter(o => o.t >= t0).sort((a, b) => a.t - b.t);
  const X = t => (px + (t - t0) / (now - t0) * (w - 2 * px)).toFixed(1);
  const Y = v => (h - py - Math.max(0, Math.min(100, v)) / 100 * (h - 2 * py)).toFixed(1);
  let g = '<rect x="' + X(now - 7 * DAY) + '" y="0" width="' + (w - px - X(now - 7 * DAY)).toFixed(1) + '" height="' + h + '" fill="currentColor" opacity="0.07"/>' +
    '<line x1="' + px + '" x2="' + (w - px) + '" y1="' + Y(50) + '" y2="' + Y(50) + '" stroke="currentColor" opacity="0.25" stroke-dasharray="3 3"/>';
  if (pts.length > 1) g += '<polyline fill="none" stroke="currentColor" stroke-width="2" points="' + pts.map(o => X(o.t) + ',' + Y(o.s)).join(' ') + '"/>';
  g += pts.map(o => '<circle cx="' + X(o.t) + '" cy="' + Y(o.s) + '" r="3" fill="currentColor"/>').join('');
  return '<svg class="spark30 ' + dir + '" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Scores over the last 30 days, ' + pts.length + ' reading' + (pts.length === 1 ? '' : 's') + '">' + g + '</svg>' +
    '<div class="small" style="display:flex;justify-content:space-between"><span>30 days ago</span><span>&mdash;&gt;</span><span>Today</span></div>' +
    (pts.length ? '' : '<div class="small">No readings in the last 30 days.</div>');
}
function needs(p) {
  const dBase = p.latest_baseline == null ? 0 : p.latest_score - p.latest_baseline;
  const dCall = (p.latest_start == null || p.latest_end == null) ? 0 : p.latest_end - p.latest_start;
  return dBase <= -FLAG || dCall <= -FLAG || p.latest_score < 45;
}
function advice(a) {
  if (!a) return '';
  const none = /^no action needed/i.test(a.trim());
  return '<div class="' + (none ? 'small' : 'note') + '"><b>What to do:</b> ' + esc(a) + '</div>';
}
function driver(d, src, q, s0, s1) {
  if (!d) return '';
  const moved = s0 != null && s1 != null && Math.abs(s1 - s0) >= FLAG;
  return '<div class="small" style="margin-top:6px"><b>' + (moved ? 'What moved it' : 'Nothing moved it much; description only') + '</b> (' + esc(SRC[src] || 'unclear') + '): ' + esc(d) + '</div>' + (q ? '<div class="quote">“' + esc(q) + '”</div>' : '');
}
function render(D) {
  let h = '<h1>Sentiment</h1>' +
    '<div class="note">Each score is Claude’s reading of how someone felt toward you during one call (0–100, 50 neutral), from the words only, not tone of voice. “Usual” is their average from earlier calls. Movements under ' + FLAG + ' points are treated as steady; that threshold is a provisional rule of thumb, not calibrated. Treat flags as a prompt to look at the quote, not as a measurement. People appear once you have confirmed who they are in Recording Review.</div>';
  const people = D.people.slice().sort((a, b) => (needs(b) - needs(a)) || a.name.localeCompare(b.name));
  h += '<h2>How people feel toward you</h2>';
  h += people.length ? '<div class="cards2">' + people.map(p => '<div class="card"><div class="two"><div><h3>' + esc(p.name) + nameArrow(p.series30) + (needs(p) ? '<span class="chip">Needs attention</span>' : '') + (p.company ? '<div class="small">' + esc(p.company) + '</div>' : '') + '</h3>' +
    '<div class="small">' + p.readings + ' call' + (p.readings === 1 ? '' : 's') + ' · last ' + fmtD(p.latest_at) + ' · confidence ' + esc(p.latest_confidence) + '</div></div>' +
    '<div><span class="big">' + p.latest_score + '</span></div></div>' + delta(p.latest_score, p.latest_baseline) + inCall(p.latest_start, p.latest_end) + '<div>' + trajectory(p.series30) + '</div>' + spark30(p.series30) +
    '<div class="small" style="margin-top:8px"><b>Why this score, in their words:</b></div><div class="quote">“' + esc(p.latest_quote) + '”</div>' + (p.latest_quote_verified === false ? '<div class="small">Quote not found in this person’s own words in the transcript (possible speaker mix-up); treat the score with care.</div>' : '') +
    driver(p.latest_driver, p.latest_driver_source, p.latest_driver_quote, p.latest_start, p.latest_end) + advice(p.latest_advice) +
    '<div class="small"><a href="recordingreview.html?r=' + p.latest_recording_id + '">Open that recording</a></div></div>').join('') + '</div>'
    : '<div class="empty">No “toward you” readings for confirmed people yet.</div>';
  h += '<h2>Your own mood</h2>';
  if (D.nick_state.length) {
    h += '<div class="card"><table class="t"><tr><th>Date</th><th>Score</th><th>Why</th></tr>' + D.nick_state.slice().reverse().map(o =>
      '<tr><td>' + fmtD(o.at) + '</td><td>' + o.score + '<div>' + delta(o.score, o.baseline) + '</div><div class="small">' + esc(o.confidence) + '</div></td><td class="small">' + esc(o.driver || '') + (o.advice && !/^no action needed/i.test(o.advice) ? '<div><b>What to do:</b> ' + esc(o.advice) + '</div>' : '') + '</td></tr>').join('') + '</table></div>';
  } else h += '<div class="empty">None yet.</div>';
  h += '<h2>Recordings</h2>';
  h += D.recordings.length ? D.recordings.map(r => {
    const rd = r.readings.filter(o => o.subject !== 'call_overall').map(o => '<tr><td>' + esc(SUBJ[o.subject] || o.subject) + '</td><td>' + esc(o.speaker || '') + (o.identified ? '' : '<div class="small">not linked to a person</div>') + (o.quote_verified === false ? '<div class="small">quote not verified</div>' : '') + '</td><td>' + o.score + (o.score_start != null && o.score_end != null ? '<div class="small">' + o.score_start + ' → ' + o.score_end + '</div>' : '') + '<div>' + delta(o.score, o.baseline) + '</div></td></tr>').join('');
    const bh = r.behaviours.map(b => '<tr><td>' + esc(b.name) + '</td><td>' + (b.measure === 'metric' ? esc(b.value) + ' ' + esc(b.unit || '') : esc(b.rating || '')) + (b.quote ? '<div class="small">“' + esc(b.quote) + '”</div>' : '') + '</td></tr>').join('');
    return '<a class="card" style="display:block;text-decoration:none;color:inherit" href="recordingreview.html?r=' + r.recording_id + '"><h3>' + esc(r.title || 'Untitled') + '</h3><div class="small">' + fmtD(r.recorded_at) + '</div>' +
      (rd ? '<table class="t"><tr><th>Reading</th><th>Who</th><th>Score</th></tr>' + rd + '</table>' : '<div class="small">No readings.</div>') +
      (bh ? '<table class="t"><tr><th>Behaviour</th><th>Result</th></tr>' + bh + '</table>' : '') + '</a>';
  }).join('') : '<div class="empty">No recordings yet.</div>';
  $('root').innerHTML = h;
}
async function start() {
  const pin = store.get('mansys_review_pin');
  if (!pin) return gate('');
  $('root').innerHTML = '<div class="empty">Loading\u2026</div>';
  try { render(await call({ pin })); } catch (e) { fail(e); }
}
start();
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sentiment</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12203A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080E1B" media="(prefers-color-scheme: dark)">
<style>
:root { color-scheme: light dark;
  --bg:#F2F1ED; --card:#FFFFFF; --line:#E0DDD3; --ink:#12203A; --muted:#565F73; --top:#12203A; --top-ink:#D9DFEC; --brand:#FFC24B;
  --ok-bg:#E3F5E9; --ok-ink:#1B6B3A; --warn-bg:#FFF1D6; --warn-ink:#7A4B00; --bad-bg:#FDE8E6; --bad-ink:#8A1C12; --field:#FBFAF7;
  --font:-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif; }
@media (prefers-color-scheme: dark) { :root {
  --bg:#0C1424; --card:#15203A; --line:#26345A; --ink:#EAEEF7; --muted:#A6B0C6; --top:#080E1B; --top-ink:#A6B0C6; --field:#0F1930;
  --ok-bg:#12341F; --ok-ink:#8FE0AC; --warn-bg:#3A2D0E; --warn-ink:#FFD98A; --bad-bg:#3A1714; --bad-ink:#F4A59B; } }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%; }
.top { background:var(--top); color:var(--top-ink); padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px; display:flex; justify-content:space-between; align-items:center; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
.top b { color:var(--brand); letter-spacing:.14em; }
main { max-width:760px; margin:0 auto; padding:16px 16px 130px; }
h1 { font-size:22px; letter-spacing:-.01em; }
h2 { font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin:24px 0 4px; }
.sub { color:var(--muted); font-size:13px; margin-top:2px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin:10px 0; }
.card h3 { font-size:15px; }
.chip { display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--warn-bg); color:var(--warn-ink); margin-left:6px; vertical-align:middle; }
.chip.done { background:var(--ok-bg); color:var(--ok-ink); }
.chip.kind { background:var(--field); color:var(--muted); border:1px solid var(--line); }
.summary { white-space:pre-wrap; font-size:14px; }
.quote { font-style:italic; color:var(--muted); font-size:13px; margin:6px 0; border-left:3px solid var(--line); padding-left:8px; }
.dupe { background:var(--warn-bg); color:var(--warn-ink); border-radius:10px; padding:8px 10px; margin:8px 0; font-size:13px; }
label.f { display:block; font-size:12px; color:var(--muted); margin-top:8px; }
input[type=text], input[type=date], select, textarea { width:100%; border:1px solid var(--line); border-radius:10px; background:var(--field); color:var(--ink); font:inherit; font-size:15px; padding:8px 10px; }
textarea { min-height:56px; resize:vertical; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.dec { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.dec label { border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:13px; cursor:pointer; background:var(--card); }
.dec input { display:none; }
.dec input:checked + span { font-weight:700; }
.dec label:has(input:checked) { background:var(--top); color:var(--brand); border-color:var(--top); }
.dec label:has(input[value=reject]:checked) { background:var(--bad-bg); color:var(--bad-ink); border-color:var(--bad-ink); }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; font-size:14px; }
.row input[type=checkbox] { width:18px; height:18px; }
.list a { display:block; text-decoration:none; color:var(--ink); }
button { font:inherit; font-size:14px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:7px 12px; cursor:pointer; }
.bar { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); }
.bar .in { max-width:760px; margin:0 auto; display:flex; gap:12px; align-items:center; }
.bar .msg { flex:1; font-size:13px; color:var(--muted); }
button.go { background:var(--top); color:var(--brand); border-color:var(--top); font-weight:700; padding:10px 18px; }
button.go[disabled] { opacity:.45; }
.msg.ok { color:var(--ok-ink); font-weight:600; } .msg.err { color:var(--bad-ink); font-weight:600; }
.gate { max-width:360px; margin:60px auto; text-align:center; }
.gate input { font-size:18px; padding:12px; text-align:center; margin:12px 0; }
.empty { color:var(--muted); text-align:center; padding:40px 0; }
.err-box { background:var(--bad-bg); color:var(--bad-ink); border-radius:12px; padding:10px 14px; margin:12px 0; font-size:14px; }
a.back { font-size:13px; color:var(--muted); }
.big { font-size:28px; font-weight:700; }
.delta.up { color:var(--ok-ink); } .delta.down { color:var(--bad-ink); } .delta { font-size:13px; font-weight:600; margin-left:6px; }
.spark { display:block; margin-top:6px; }
.two { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
.small { font-size:12px; color:var(--muted); }
table.t { width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; }
table.t td, table.t th { text-align:left; padding:4px 6px 4px 0; border-bottom:1px solid var(--line); vertical-align:top; }
.note { background:var(--warn-bg); color:var(--warn-ink); border-radius:10px; padding:8px 10px; margin:10px 0; font-size:13px; }
</style></head>
<body>
<div class="top"><b>MANSYS</b><span>Sentiment</span></div>
<main id="root"></main>
<script>
const FN_URL = 'https://dglotzmioswcmhfttcqx.supabase.co/functions/v1/sentimentview';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const fmtD = d => d ? new Date(d).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric', timeZone:'Europe/London' }) : 'Date unknown';
const SUBJ = { toward_nick:'Toward you', own_state:'Your own mood', call_overall:'Whole call' };
async function call(body) {
  const r = await fetch(FN_URL, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error(j.error || ('HTTP ' + r.status)); err.code = j.error; throw err; }
  return j;
}
function gate(msg) {
  $('root').innerHTML = '<div class="gate"><h1>Sentiment</h1><div class="sub">Enter your PIN</div>' + (msg ? '<div class="err-box">' + esc(msg) + '</div>' : '') +
    '<input id="pin" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false"><button class="go" id="pinGo">Open</button></div>';
  const go = () => { const v = $('pin').value.trim(); if (v) { store.set('mansys_review_pin', v); start(); } };
  $('pinGo').onclick = go; $('pin').onkeydown = e => { if (e.key === 'Enter') go(); };
}
function fail(e) {
  if (e.code === 'bad_pin') { store.del('mansys_review_pin'); return gate('That PIN is not right.'); }
  if (e.code === 'locked') return gate('Too many wrong attempts. Try again in 15 minutes.');
  $('root').innerHTML = '<div class="empty">Could not load. Try again shortly.</div>';
}
function delta(score, base) {
  if (base == null) return '<span class="small"> no baseline yet</span>';
  const d = score - base;
  return '<span class="delta ' + (d >= 0 ? 'up' : 'down') + '">' + (d >= 0 ? '+' : '') + d + ' vs baseline ' + base + '</span>';
}
function spark(vals) {
  if (!vals || vals.length < 2) return '';
  const w = 160, h = 32, n = vals.length;
  const pts = vals.map((v, i) => (i * (w - 4) / (n - 1) + 2).toFixed(1) + ',' + (h - 2 - (Math.max(0, Math.min(100, v)) / 100) * (h - 4)).toFixed(1)).join(' ');
  return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-label="Trend, oldest to newest"><polyline fill="none" stroke="currentColor" stroke-width="2" points="' + pts + '"/></svg>';
}
function render(D) {
  let h = '<a class="back" href="#" onclick="history.length > 1 ? history.back() : (location.href = \'dashboard-mobile-push.html\'); return false;">\u2039 Dashboard</a><h1>Sentiment</h1>' +
    '<div class="note">Scores read the words only, not tone of voice, on a 0\u2013100 scale (50 is neutral). Treat them as a prompt to look, not a measurement. A person only appears here once you have confirmed who they are in Recording Review.</div>';
  h += '<h2>How people feel toward you</h2>';
  h += D.people.length ? D.people.map(p => '<div class="card"><div class="two"><div><h3>' + esc(p.name) + (p.company ? '<span class="small"> \u00b7 ' + esc(p.company) + '</span>' : '') + '</h3>' +
    '<div class="small">' + p.readings + ' reading' + (p.readings === 1 ? '' : 's') + ' \u00b7 last ' + fmtD(p.latest_at) + ' \u00b7 confidence ' + esc(p.latest_confidence) + '</div></div>' +
    '<div><span class="big">' + p.latest_score + '</span>' + delta(p.latest_score, p.latest_baseline) + '</div></div>' + spark(p.series) +
    '<div class="quote">\u201c' + esc(p.latest_quote) + '\u201d</div><div class="small">' + esc(p.latest_rationale) + '</div>' +
    '<div class="small"><a href="recordingreview.html?r=' + p.latest_recording_id + '">Open that recording</a></div></div>').join('')
    : '<div class="empty">No \u201ctoward you\u201d readings yet. They start with your next recording, once the speaker is confirmed.</div>';
  h += '<h2>Your own mood</h2>';
  if (D.nick_state.length) {
    h += '<div class="card"><table class="t"><tr><th>Date</th><th>Score</th><th>Evidence</th></tr>' + D.nick_state.slice().reverse().map(o =>
      '<tr><td>' + fmtD(o.at) + '</td><td>' + o.score + delta(o.score, o.baseline) + '<div class="small">' + esc(o.confidence) + '</div></td><td class="small">\u201c' + esc(o.quote) + '\u201d</td></tr>').join('') + '</table></div>';
  } else h += '<div class="empty">None yet.</div>';
  h += '<h2>Recordings</h2>';
  h += D.recordings.length ? D.recordings.map(r => {
    const rd = r.readings.map(o => '<tr><td>' + esc(SUBJ[o.subject] || o.subject) + '</td><td>' + esc(o.speaker || 'Whole call') + (o.identified ? '' : '<div class="small">not confirmed</div>') + '</td><td>' + o.score + delta(o.score, o.baseline) + '<div class="small">' + esc(o.confidence) + '</div></td></tr>').join('');
    const bh = r.behaviours.map(b => '<tr><td>' + esc(b.name) + '</td><td>' + (b.measure === 'metric' ? esc(b.value) + ' ' + esc(b.unit || '') : esc(b.rating || '')) + (b.quote ? '<div class="small">\u201c' + esc(b.quote) + '\u201d</div>' : '') + '</td></tr>').join('');
    return '<a class="card" style="display:block;text-decoration:none;color:inherit" href="recordingreview.html?r=' + r.recording_id + '"><h3>' + esc(r.title || 'Untitled') + '</h3><div class="small">' + fmtD(r.recorded_at) + '</div>' +
      (rd ? '<table class="t"><tr><th>Subject</th><th>Who</th><th>Score</th></tr>' + rd + '</table>' : '<div class="small">No sentiment readings.</div>') +
      (bh ? '<table class="t"><tr><th>Behaviour</th><th>Result</th></tr>' + bh + '</table>' : '') + '</a>';
  }).join('') : '<div class="empty">No recordings yet.</div>';
  $('root').innerHTML = h;
}
async function start() {
  const pin = store.get('mansys_review_pin');
  if (!pin) return gate('');
  $('root').innerHTML = '<div class="empty">Loading\u2026</div>';
  try { render(await call({ pin })); } catch (e) { fail(e); }
}
start();
</script>
</body>
</html>

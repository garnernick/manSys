<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ManSys</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ManSys">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12203A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080E1B" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22ManSys%22%2C%22short_name%22%3A%22ManSys%22%2C%22start_url%22%3A%22.%2Fdashboard-mobile.html%3Ftoken%3Dfdb44961c5a73eb588b68e9614f58671%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23F2F1ED%22%2C%22theme_color%22%3A%22%2312203A%22%2C%22orientation%22%3A%22portrait%22%7D">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light dark;
  --bg:#F2F1ED; --card:#FFFFFF; --card2:#E7E5DD; --tint:#E3E9F7; --line:#E0DDD3; --edge:#C8C4B8;
  --ink:#12203A; --muted:#565F73; --accent:#12203A; --on-accent:#FFC24B; --soft:#FFE9B8; --soft-ink:#5A3A00;
  --top:#12203A; --top-ink:#D9DFEC; --brand:#FFC24B; --nav:#FFFFFF; --overlay:rgba(18,32,58,.45);
  --danger-bg:#FDE8E6; --danger-ink:#8A1C12; --danger-edge:#F2C9C4;
  --ok-bg:#E3F5E9; --ok-ink:#1B6B3A; --ok-edge:#BFE3CC;
  --warn-bg:#FFF1D6; --warn-ink:#7A4B00; --warn-edge:#F2DCA8;
  --info-bg:#E3E9F7; --info-ink:#2A4FA8; --info-edge:#C5D1EE;
  --pur-bg:#ECE6FA; --pur-ink:#5B3FA8; --pur-edge:#D6CAF0;
  --shadow:0 1px 2px rgba(20,20,19,.07);
  --font:'Inter',-apple-system,system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#0C1424; --card:#15203A; --card2:#1E2B48; --tint:#172A52; --line:#26345A; --edge:#3A4A74;
    --ink:#EAEEF7; --muted:#A6B0C6; --accent:#FFC24B; --on-accent:#1A1200; --soft:#3A2D0E; --soft-ink:#FFD98A;
    --top:#080E1B; --top-ink:#C9D1E3; --brand:#FFC24B; --nav:#101A30; --overlay:rgba(0,0,0,.6);
    --danger-bg:#3A1714; --danger-ink:#FFB3AB; --danger-edge:#5A2622;
    --ok-bg:#12301E; --ok-ink:#6DE39A; --ok-edge:#1F4A31;
    --warn-bg:#3A2C0E; --warn-ink:#FFC66B; --warn-edge:#5A4519;
    --info-bg:#172A52; --info-ink:#9DB8FF; --info-edge:#2B4380;
    --pur-bg:#2A1F4A; --pur-ink:#CDB8FF; --pur-edge:#43357A;
    --shadow:0 0 0 1px var(--line);
  }
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html { background:var(--nav); }
html, body { height:100%; color:var(--ink); font-family:var(--font); font-size:14px; overflow:hidden; }
body { background:var(--nav); }

/* Auth */
#auth-gate { display:none; position:fixed; inset:0; background:var(--bg); align-items:center; justify-content:center; flex-direction:column; gap:12px; z-index:999; }
#auth-gate p { font-family:var(--mono); font-size:12px; color:var(--danger-ink); }
#app { display:none; position:fixed; top:0; left:0; right:0; bottom:0; flex-direction:column; background:var(--bg); }

/* MANSYS bar */
.top { background:var(--top); color:var(--top-ink); padding:calc(var(--safe-top) + 8px) 16px 8px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.brand { font-family:var(--mono); font-size:12px; font-weight:500; color:var(--brand); letter-spacing:.14em; }
.clock { font-family:var(--mono); font-size:11px; color:var(--top-ink); letter-spacing:.03em; display:flex; gap:10px; align-items:baseline; }
.clock b { font-weight:500; color:#fff; font-size:12px; }
.head { display:flex; align-items:center; justify-content:space-between; padding:12px 16px 6px; flex-shrink:0; }
.tab-title { font-size:22px; font-weight:600; color:var(--ink); letter-spacing:-.01em; }
.head-btns { display:flex; gap:8px; }
.ibtn { width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px; box-shadow:var(--shadow); font-family:var(--mono); }
.ibtn.has, .ibtn.active { background:var(--soft); color:var(--soft-ink); border-color:var(--accent); }
.add-fab { width:36px; height:36px; border-radius:10px; border:none; background:var(--accent); color:var(--on-accent); font-size:22px; font-weight:400; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; }

/* Who segment */
.seg-wrap { padding:2px 16px 4px; flex-shrink:0; }
.seg { display:flex; background:var(--card2); border-radius:10px; padding:3px; }
.seg button { flex:1; border:none; background:transparent; color:var(--muted); font-family:var(--font); font-size:13px; font-weight:500; padding:7px 0; border-radius:8px; cursor:pointer; }
.seg button.on { background:var(--card); color:var(--ink); box-shadow:var(--shadow); }
.legend { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); margin-top:6px; }
.legend i { width:12px; height:12px; border-radius:3px; background:var(--tint); border:1px solid var(--edge); display:inline-block; }

/* Stats */
.stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:8px 16px; flex-shrink:0; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:7px 9px; box-shadow:var(--shadow); min-width:0; }
.stat-label { font-family:var(--mono); font-size:8.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stat-value { font-family:var(--mono); font-size:18px; font-weight:500; color:var(--ink); }
.stat-value.accent { color:var(--soft-ink); } .stat-value.red { color:var(--danger-ink); } .stat-value.blue { color:var(--info-ink); } .stat-value.amber { color:var(--warn-ink); }
@media (prefers-color-scheme: dark) { .stat-value.accent { color:var(--accent); } }

/* Search */
.search-bar { padding:0 16px 6px; flex-shrink:0; }
.search-input { width:100%; background:var(--card); border:1px solid var(--line); color:var(--ink); font-family:var(--font); font-size:14px; border-radius:12px; padding:9px 12px; outline:none; box-shadow:var(--shadow); -webkit-appearance:none; }
.search-input::placeholder { color:var(--muted); }
.search-input:focus { border-color:var(--accent); }

/* List */
.list-wrap { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 16px 12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px; cursor:pointer; box-shadow:var(--shadow); transition:background .1s; }
.card:active { background:var(--card2); }
.card.theirs { background:var(--tint); }
.card.theirs:active { background:var(--card2); }
.card-row { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.card-title { font-size:14.5px; font-weight:500; color:var(--ink); line-height:1.35; }
.card-arrow { color:var(--muted); font-size:15px; flex-shrink:0; }
.card-meta { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:7px; }
.card-sub { font-size:11px; color:var(--muted); font-family:var(--mono); }
.owner-chip { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:500; color:var(--info-ink); background:var(--card); border:1px solid var(--edge); border-radius:20px; padding:1px 8px; }
.badge { display:inline-block; padding:2px 8px; border-radius:20px; font-family:var(--mono); font-size:10px; letter-spacing:.02em; border:1px solid transparent; }
.b-green  { background:var(--ok-bg);     color:var(--ok-ink);     border-color:var(--ok-edge); }
.b-blue   { background:var(--info-bg);   color:var(--info-ink);   border-color:var(--info-edge); }
.b-red    { background:var(--danger-bg); color:var(--danger-ink); border-color:var(--danger-edge); }
.b-amber  { background:var(--warn-bg);   color:var(--warn-ink);   border-color:var(--warn-edge); }
.b-gray   { background:var(--card2);     color:var(--muted);      border-color:var(--line); }
.b-purple { background:var(--pur-bg);    color:var(--pur-ink);    border-color:var(--pur-edge); }
.b-must   { background:var(--soft);      color:var(--soft-ink);   border-color:var(--accent); font-size:9px; }
.b-deep   { background:var(--info-bg);   color:var(--info-ink);   border-color:var(--info-edge); font-size:9px; }
.overdue-date { color:var(--danger-ink); font-weight:500; }
.empty-state { text-align:center; padding:60px 24px; color:var(--muted); font-size:13px; }
.loading { text-align:center; padding:40px; color:var(--muted); font-family:var(--mono); font-size:11px; }
::-webkit-scrollbar { display:none; }

/* Bottom nav */
.tabbar { flex-shrink:0; padding:6px 8px calc(max(0px, var(--safe-bot) - var(--gap, 0px)) + 6px); background:var(--nav); border-top:1px solid var(--line); display:flex; gap:2px; z-index:50; }
.tab-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; border:none; background:transparent; color:var(--muted); padding:4px 0; font-family:var(--font); }
.tab-icon { width:48px; height:26px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:15px; line-height:1; transition:background .15s; }
.tab-label { font-size:10.5px; font-weight:500; }
.tab-item.active { color:var(--ink); }
.tab-item.active .tab-icon { background:var(--soft); color:var(--soft-ink); }

/* Sheets */
.sheet-overlay { position:fixed; inset:0; background:var(--overlay); z-index:100; opacity:0; pointer-events:none; transition:opacity .25s; }
.sheet-overlay.open { opacity:1; pointer-events:all; }
.sheet { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-radius:20px 20px 0 0; border-top:1px solid var(--line); z-index:101; transform:translateY(100%); transition:transform .3s cubic-bezier(.32,.72,0,1); max-height:92vh; display:flex; flex-direction:column; }
.sheet.open { transform:translateY(0); }
.sheet-handle { width:36px; height:4px; background:var(--edge); border-radius:2px; margin:10px auto 4px; flex-shrink:0; }
.sheet-header { display:flex; align-items:center; justify-content:space-between; padding:4px 20px 12px; flex-shrink:0; border-bottom:1px solid var(--line); }
.sheet-title { font-size:17px; font-weight:600; color:var(--ink); }
.sheet-close { width:32px; height:32px; background:var(--card2); border:none; border-radius:10px; color:var(--muted); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.sheet-body { overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 20px; flex:1; padding-bottom:calc(var(--safe-bot) + 80px); }
.sheet-footer { position:sticky; bottom:0; background:var(--card); padding:12px 20px calc(var(--safe-bot) + 12px); border-top:1px solid var(--line); display:flex; gap:10px; flex-shrink:0; }
.btn-cancel { flex:1; padding:13px; background:var(--card2); border:1px solid var(--line); color:var(--muted); font-family:var(--font); font-size:14px; font-weight:500; border-radius:12px; cursor:pointer; }
.btn-save { flex:2; padding:13px; background:var(--accent); border:none; color:var(--on-accent); font-family:var(--font); font-size:14px; font-weight:600; border-radius:12px; cursor:pointer; }
.btn-delete-sheet { flex:1; padding:13px; background:transparent; border:1px solid var(--danger-edge); color:var(--danger-ink); font-family:var(--font); font-size:14px; font-weight:500; border-radius:12px; cursor:pointer; }

/* Forms */
.form-row { margin-bottom:14px; }
.form-row label { display:block; font-family:var(--mono); font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
.form-row input, .form-row select, .form-row textarea { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--ink); font-family:var(--font); font-size:15px; border-radius:12px; padding:11px 12px; outline:none; -webkit-appearance:none; appearance:none; }
.form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color:var(--accent); }
.form-row textarea { min-height:80px; resize:none; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.form-error { font-family:var(--mono); font-size:11px; color:var(--danger-ink); margin-top:8px; }
.select-arrow { position:relative; }
.select-arrow::after { content:'▾'; position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; font-size:12px; }
.select-arrow select { padding-right:32px; }
.toggle-row { display:flex; align-items:center; justify-content:space-between; padding:11px 12px; background:var(--bg); border:1px solid var(--line); border-radius:12px; font-size:14px; color:var(--ink); }
.tg { width:44px; height:26px; border-radius:13px; background:var(--edge); position:relative; cursor:pointer; transition:background .2s; flex-shrink:0; }
.tg-thumb { position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.35); }
.tg.on { background:var(--accent); }
.tg.on .tg-thumb { transform:translateX(18px); }
@media (prefers-color-scheme: dark) { .tg.on .tg-thumb { background:var(--on-accent); } }

/* Filters */
.filter-bar { display:flex; gap:6px; padding:2px 16px 6px; overflow-x:auto; flex-shrink:0; }
.filter-bar::-webkit-scrollbar { display:none; }
.filter-pill { display:flex; align-items:center; gap:4px; padding:5px 12px; background:var(--card); border:1px solid var(--line); border-radius:20px; font-family:var(--mono); font-size:10px; color:var(--muted); cursor:pointer; white-space:nowrap; }
.filter-pill.active { border-color:var(--accent); color:var(--soft-ink); background:var(--soft); }
.filter-section { margin-bottom:20px; }
.filter-section-label { font-family:var(--mono); font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }
.filter-chips { display:flex; flex-wrap:wrap; gap:8px; }
.filter-chip { padding:8px 14px; background:var(--bg); border:1px solid var(--line); border-radius:20px; font-size:13px; color:var(--muted); cursor:pointer; transition:all .12s; }
.filter-chip.selected { border-color:var(--accent); color:var(--soft-ink); background:var(--soft); font-weight:500; }
.filter-reset { padding:13px; background:transparent; border:1px solid var(--line); color:var(--muted); font-family:var(--font); font-size:14px; font-weight:500; border-radius:12px; cursor:pointer; flex:1; }
.filter-apply { flex:2; padding:13px; background:var(--accent); border:none; color:var(--on-accent); font-family:var(--font); font-size:14px; font-weight:600; border-radius:12px; cursor:pointer; }
.more-row { display:flex; align-items:center; gap:12px; padding:14px; background:var(--bg); border:1px solid var(--line); border-radius:12px; margin-bottom:8px; cursor:pointer; font-size:15px; font-weight:500; color:var(--ink); }
.more-row span:first-child { width:30px; height:30px; border-radius:9px; background:var(--soft); color:var(--soft-ink); display:flex; align-items:center; justify-content:center; font-size:15px; }

/* Chat */
.chat-view { display:none; flex-direction:column; flex:1; overflow:hidden; background:var(--bg); }
.chat-view.active { display:flex; }
.chat-toolbar-m { display:flex; gap:6px; padding:8px 16px; flex-shrink:0; overflow-x:auto; }
.chat-toolbar-m::-webkit-scrollbar { display:none; }
.chat-tool-btn-m { flex-shrink:0; padding:6px 12px; background:var(--card); border:1px solid var(--line); color:var(--muted); font-family:var(--font); font-size:12px; font-weight:500; border-radius:20px; cursor:pointer; white-space:nowrap; }
.chat-tool-btn-m:active { border-color:var(--accent); color:var(--soft-ink); background:var(--soft); }
.chat-messages-m { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:8px 16px; display:flex; flex-direction:column; gap:10px; }
.chat-msg-m { display:flex; flex-direction:column; max-width:86%; gap:3px; }
.chat-msg-m.ai { align-self:flex-start; }
.chat-msg-m.user { align-self:flex-end; align-items:flex-end; }
.chat-msg-label-m { font-family:var(--mono); font-size:10px; color:var(--muted); padding:0 4px; letter-spacing:.04em; text-transform:uppercase; }
.chat-bubble-m { padding:10px 14px; font-size:14px; line-height:1.5; word-break:break-word; border-radius:16px; }
.chat-bubble-m.ai { background:var(--card); border:1px solid var(--line); color:var(--ink); border-top-left-radius:4px; box-shadow:var(--shadow); }
.chat-bubble-m.user { background:var(--accent); color:var(--on-accent); border-top-right-radius:4px; }
.chat-bubble-m.typing { color:var(--muted); font-style:italic; }
.chat-input-row-m { display:flex; align-items:flex-end; gap:8px; padding:8px 16px; flex-shrink:0; background:var(--bg); }
.chat-input-m { flex:1; background:var(--card); border:1px solid var(--line); color:var(--ink); font-family:var(--font); font-size:15px; border-radius:14px; padding:10px 12px; outline:none; resize:none; min-height:40px; max-height:110px; line-height:1.4; -webkit-appearance:none; }
.chat-input-m:focus { border-color:var(--accent); }
.chat-send-m { height:40px; padding:0 18px; background:var(--accent); color:var(--on-accent); border:none; border-radius:14px; font-family:var(--font); font-size:14px; font-weight:600; cursor:pointer; flex-shrink:0; }
.chat-send-m:disabled { opacity:.35; }

/* Personal page access */
.pp { margin-top:6px; padding:12px; border:1px solid var(--line); border-radius:14px; background:var(--bg); }
.pp-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.pp-title { font-family:var(--mono); font-size:11px; color:var(--soft-ink); letter-spacing:.06em; text-transform:uppercase; font-weight:500; }
@media (prefers-color-scheme: dark) { .pp-title { color:var(--accent); } }
.pp-sub { font-size:12px; color:var(--muted); margin-top:3px; line-height:1.4; }
.pp-sw { width:44px; height:26px; border-radius:13px; background:var(--edge); position:relative; cursor:pointer; border:none; padding:0; flex:none; transition:background .2s; }
.pp-sw::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:10px; background:#fff; transition:transform .2s; }
.pp-sw.on { background:var(--accent); } .pp-sw.on::after { transform:translateX(18px); }
@media (prefers-color-scheme: dark) { .pp-sw.on::after { background:var(--on-accent); } }
.pp-sw:disabled { opacity:.4; cursor:not-allowed; }
.pp-link { margin-top:10px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--card); font-family:var(--mono); font-size:11px; color:var(--ink); word-break:break-all; user-select:all; }
.pp-btns { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
.pp-btn { flex:1; min-width:96px; padding:9px 10px; background:var(--card); border:1px solid var(--line); color:var(--muted); font-family:var(--font); font-size:12px; font-weight:500; border-radius:10px; cursor:pointer; }
.pp-btn:hover { border-color:var(--accent); color:var(--ink); }
.pp-btn.pri { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
.pp-btn.pri:hover { opacity:.85; color:var(--on-accent); }
.pp-btn.warn:hover { border-color:var(--danger-edge); color:var(--danger-ink); }
.pp-al { margin-top:10px; border-top:1px solid var(--line); padding-top:8px; }
.pp-row { display:flex; justify-content:space-between; align-items:center; padding:5px 0; font-size:12px; color:var(--ink); }
.pp-tag { font-family:var(--mono); font-size:10px; padding:2px 8px; border-radius:20px; border:1px solid var(--line); color:var(--muted); }
.pp-tag.on { color:var(--ok-ink); border-color:var(--ok-edge); background:var(--ok-bg); }
.pp-note { font-size:11px; color:var(--muted); margin-top:6px; line-height:1.4; }
.pp-warn { font-size:11px; color:var(--warn-ink); margin-top:8px; line-height:1.4; }
.pp-err { font-size:11px; color:var(--danger-ink); margin-top:8px; }
</style>
</head>
<body>

<div id="auth-gate">
  <p>&#x2715; Access denied</p>
</div>

<div id="app" style="display:none;flex-direction:column">
  <div class="top">
    <div class="brand">&#x25A0; MANSYS</div>
    <div class="clock"><span id="clk-date"></span><b id="clk-time"></b></div>
  </div>
  <div class="head">

// iOS home-screen mode can report a layout viewport shorter than the screen (measured on iPhone 14 Pro: 59pt short),
// which leaves a gap under the bottom bar. Extend the app by exactly that difference. Home-screen mode only.
function fixGap() {
  let gap = 0;
  const standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (standalone && window.screen && window.innerHeight) {
    const portrait = window.innerHeight >= window.innerWidth;
    const sh = portrait ? Math.max(screen.height, screen.width) : Math.min(screen.height, screen.width);
    gap = Math.round(sh - window.innerHeight);
    if (gap < 0 || gap > 100) gap = 0;
  }
  document.documentElement.style.setProperty('--gap', gap + 'px');
}

}

  if (['tasks','themes','epics'].includes(activeTab)) {

function setFormVals(r) {
  if (!r) return;
  const sv = (id, val) => { const el = document.getElementById(id); if (el && val != null) el.value = String(val); };
  const sc = (id, val) => { setToggle(id, !!val); };
  if (activeTab === 'tasks') {
    sv('ff-status', r.status_id); sv('ff-theme', r.theme_id); sv('ff-epic', r.epic_id);
    sv('ff-owner', r.owner_id); sv('ff-priority', r.priority);
    sc('ff-must', r.is_must_achieve); sc('ff-deep', r.is_deep_work);
  } else if (activeTab === 'themes') {
    sv('ff-status', r.status_id); sv('ff-domain', r.domain);
  } else if (activeTab === 'epics') {
    sv('ff-status', r.status_id); sv('ff-theme', r.theme_id); sv('ff-owner', r.owner_id); sv('ff-domain', r.domain);
  } else if (activeTab === 'commitments') {
    sv('ff-person', r.person_id); sv('ff-direction', r.direction); sv('ff-status-c', r.status);
  } else if (activeTab === 'people') {
    sc('ff-stakeholder', r.is_stakeholder); sc('ff-active', r.is_active !== false);

function openSort() {
  const isTask = activeTab === 'tasks';
  const options = isTask
    ? [
        { label: 'Added (newest first)', field: 'created_at', dir: 'desc' },
        { label: 'Added (oldest first)', field: 'created_at', dir: 'asc' },
        { label: 'Due date (soonest first)', field: 'promise_date', dir: 'asc' },
        { label: 'Due date (latest first)', field: 'promise_date', dir: 'desc' },
      ]
    : [
        { label: 'Added (newest first)', field: 'created_at', dir: 'desc' },
        { label: 'Added (oldest first)', field: 'created_at', dir: 'asc' },
        { label: 'Due date (soonest first)', field: 'promised_date', dir: 'asc' },
        { label: 'Due date (latest first)', field: 'promised_date', dir: 'desc' },
      ];

  let html = '<div class="filter-section"><div class="filter-section-label">Sort by</div><div class="filter-chips">';
  options.forEach(o => {
    const isActive = activeSort.field === o.field && activeSort.dir === o.dir;
    html += '<div class="filter-chip' + (isActive ? ' selected' : '') + '" style="width:100%;margin-bottom:4px" data-field="' + o.field + '" data-dir="' + o.dir + '" onclick="setSort(this.dataset.field, this.dataset.dir)">' + o.label + '</div>';
  });
  // Clear option
  const isClear = activeSort.field === null;
  html += '<div class="filter-chip' + (isClear ? ' selected' : '') + '" style="width:100%;margin-bottom:4px" data-field="" data-dir="desc" onclick="setSort(this.dataset.field || null, this.dataset.dir)">Default order</div>';

  document.getElementById('sheet-title').textContent = 'Sort';
  document.getElementById('sheet-body').innerHTML = html;
  document.getElementById('sheet-footer').innerHTML = '<button class="btn-cancel" onclick="closeSheet()">Close</button>';

function setSort(field, dir) {
  activeSort = { field, dir };
  const sortBtn = document.getElementById('sort-btn');
  if (sortBtn) sortBtn.classList.toggle('active', field !== null);
  closeSheet();
  loadTab();
}

function getSortedEndpoint(baseEndpoint) {
  if (!activeSort.field) return baseEndpoint;
  // Remove existing order clause and append new one
  const noOrder = baseEndpoint.replace(/&order=[^&]*/g, '');
  return noOrder + '&order=' + activeSort.field + '.' + activeSort.dir + '.nullslast';
}

function openSheet() {
  document.getElementById('sheet').classList.add('open');
  document.getElementById('sheet-overlay').classList.add('open');
  setTimeout(() => { const first = document.querySelector('#sheet-body input, #sheet-body textarea'); if (first) first.focus(); }, 350);

function closeSheet() {
  document.getElementById('sheet').classList.remove('open');

}

async function confirmDelete(id) {
  if (!confirm('Delete this record?')) return;
  const tables = { themes: 'themes', epics: 'roadmap_items', tasks: 'tasks', commitments: 'commitments', people: 'people' };
  const idKeys = { themes: 'theme_id', epics: 'roadmap_item_id', tasks: 'task_id', commitments: 'commitment_id', people: 'person_id' };
  try {
    if (activeTab === 'tasks') {
      await api('commitments?task_id=eq.' + id, { method: 'DELETE' });
      await api('task_updates?task_id=eq.' + id, { method: 'DELETE' });
    } else if (activeTab === 'people') {
      await api('tasks?owner_id=eq.' + id, { method: 'PATCH', body: { owner_id: null }, prefer: 'return=minimal' });
      await api('tasks?requested_by_id=eq.' + id, { method: 'PATCH', body: { requested_by_id: null }, prefer: 'return=minimal' });
      await api('commitments?person_id=eq.' + id, { method: 'DELETE' });
      await api('stakeholder_eq_scores?person_id=eq.' + id, { method: 'DELETE' });
      await api('event_participants?person_id=eq.' + id, { method: 'DELETE' });
      await api('newsletter_inputs?contributor_id=eq.' + id, { method: 'DELETE' });
      await api('newsletter_recipients?person_id=eq.' + id, { method: 'DELETE' });
      await api('roadmap_items?owner_id=eq.' + id, { method: 'PATCH', body: { owner_id: null }, prefer: 'return=minimal' });
    } else if (activeTab === 'themes') {
      await api('tasks?theme_id=eq.' + id, { method: 'PATCH', body: { theme_id: null }, prefer: 'return=minimal' });
      await api('roadmap_items?theme_id=eq.' + id, { method: 'PATCH', body: { theme_id: null }, prefer: 'return=minimal' });
    } else if (activeTab === 'epics') {
      await api('tasks?epic_id=eq.' + id, { method: 'PATCH', body: { epic_id: null }, prefer: 'return=minimal' });
      await api('commitments?epic_id=eq.' + id, { method: 'PATCH', body: { epic_id: null }, prefer: 'return=minimal' });
    }
    await api(tables[activeTab] + '?' + idKeys[activeTab] + '=eq.' + id, { method: 'DELETE' });
    closeSheet();
    if (activeTab === 'people') await refreshPeople();
    loadTab();
  } catch (err) {
    alert('Delete failed: ' + err.message);
    console.error('Delete failed:', err);
  }
}


// ---- Personal page access (portal) — grants/revokes a person's me.html link ----
// Needs 03_personal_pages_and_alerts.sql to have been run (adds people.share_token / portal_enabled / alert flags).
const PORTAL_BASE = 'https://garnernick.github.io/manSys/me.html';
const PORTAL_NICK_ID = 1;
function ppEsc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ppRow() { return (typeof allRows !== 'undefined' && editingId != null) ? allRows.find(x => x.person_id === editingId) : null; }
function ppLink(r) { return r && r.share_token ? PORTAL_BASE + '?t=' + r.share_token : ''; }
function ppUuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16); crypto.getRandomValues(b); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}
function portalBlockHtml(r) {
  if (!r || !r.person_id) return '';
  const first = ppEsc((r.full_name || 'them').split(' ')[0]);
  if (r.person_id === PORTAL_NICK_ID) {
    return '<div class="pp-head"><div><div class="pp-title">Personal page</div><div class="pp-sub">Not available for you — this is your own dashboard.</div></div></div>';
  }
  if (r.share_token === undefined) {
    return '<div class="pp-head"><div><div class="pp-title">Personal page</div></div></div><div class="pp-err">Link columns not found. Run 03_personal_pages_and_alerts.sql in Supabase first.</div>';
  }
  const on = !!r.portal_enabled, inactive = r.is_active === false;
  if (inactive) {
    return '<div class="pp-head"><div><div class="pp-title">Personal page</div><div class="pp-sub">' + first + ' is inactive, so has no access. Personal pages are for active people only. Make them active again to manage their link.</div></div><button type="button" class="pp-sw" disabled aria-label="Personal page access"></button></div>';
  }
  let h = '<div class="pp-head"><div><div class="pp-title">Personal page</div><div class="pp-sub">' +
    (on ? first + ' can view and update their own tasks and commitments.' : 'Off — nothing is visible at ' + first + '\'s link.') +
    '</div></div><button type="button" class="pp-sw' + (on ? ' on' : '') + '" aria-label="Personal page access" onclick="portalToggle(' + (on ? 'false' : 'true') + ')"></button></div>';
  if (on) {
    h += '<div class="pp-link" id="pp-link">' + ppEsc(ppLink(r)) + '</div>' +
      '<div class="pp-btns"><button type="button" class="pp-btn pri" onclick="portalCopy(this)">Copy link</button>' +
      '<button type="button" class="pp-btn" onclick="portalOpen()">Open as ' + first + '</button></div>' +
      (r.work_email ? '<div class="pp-btns"><button type="button" class="pp-btn" id="pp-email" onclick="portalEmail(this)">Email link to ' + ppEsc(r.work_email) + '</button></div>' : '') +
      '<div class="pp-btns"><button type="button" class="pp-btn warn" onclick="portalReset()">Reset link</button></div>' +
      '<div class="pp-note">Reset: the old link stops working straight away. Send ' + first + ' the new one.</div>' +
      '<div class="pp-al"><div class="pp-title" style="color:var(--muted)">' + first + '\'s email alerts</div>' +
      '<div class="pp-row"><span>New from Nick</span><span class="pp-tag' + (r.notify_new_from_nick !== false ? ' on' : '') + '">' + (r.notify_new_from_nick !== false ? 'On' : 'Off') + '</span></div>' +
      '<div class="pp-row"><span>Updates on what ' + first + ' sent you</span><span class="pp-tag' + (r.notify_updates_on_sent ? ' on' : '') + '">' + (r.notify_updates_on_sent ? 'On' : 'Off') + '</span></div>' +
      '<div class="pp-note">' + first + ' changes these from the bell icon on their own page. Read-only here.</div></div>';
    if (!r.work_email) h += '<div class="pp-warn">No work email on file — ' + first + ' can use the page but will receive no alert emails.</div>';
  }
  return h;
}
function portalRender() { const el = document.getElementById('portal-block'); if (el) el.innerHTML = portalBlockHtml(ppRow()); }
function portalErr(m) { const el = document.getElementById('portal-block'); if (el) el.insertAdjacentHTML('beforeend', '<div class="pp-err">' + ppEsc(m) + '</div>'); }
async function portalPatch(r, body) {
  await api('people?person_id=eq.' + r.person_id, { method: 'PATCH', body, prefer: 'return=minimal' });
  Object.assign(r, body);
  portalRender();

}
async function portalToggle(on) {
  const r = ppRow(); if (!r) return;

}
async function portalReset() {

  if (!confirm('Reset ' + (r.full_name || 'this person') + '\'s link? The old link stops working immediately.')) return;
  try { await portalPatch(r, { share_token: ppUuid() }); } catch (e) { portalErr('Could not reset: ' + e.message); }

async function portalEmail(btn) {
  const r = ppRow(); if (!r || !r.work_email) return;
  const label = btn.textContent; btn.disabled = true; btn.textContent = 'Sending…';
  const msgs = { too_soon: 'Sent less than a minute ago', page_off: 'Switch the page on first', inactive: 'Person is inactive', no_email: 'No work email on file', send_failed: 'Email failed — try again' };
  let out;
  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/send_portal_link', {
      method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY },
      body: JSON.stringify({ person_id: r.person_id }),
    });
    let j = {}; try { j = await res.json(); } catch (e) {}
    out = res.ok && j.ok ? 'Sent ✓ to ' + (j.to || r.work_email) : (msgs[j.error] || 'Could not send (' + res.status + ')');
  } catch (e) { out = 'Could not reach the email function'; }
  btn.textContent = out;
  setTimeout(() => { btn.disabled = false; btn.textContent = label; }, 4000);
}
function portalOpen() { const r = ppRow(); const l = ppLink(r); if (l) window.open(l, '_blank', 'noopener'); }
async function portalCopy(btn) {
  const r = ppRow(); const l = ppLink(r); if (!l) return;
  let ok = false;
  try { await navigator.clipboard.writeText(l); ok = true; } catch (e) {}
  if (!ok) {
    const ta = document.createElement('textarea'); ta.value = l; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch (e) {} ta.remove();
  }
  if (btn) { const t = btn.textContent; btn.textContent = ok ? 'Copied ✓' : 'Copy failed'; setTimeout(() => { btn.textContent = t; }, 1600); }
}

async function saveRecord() {
  const v = id => { const el = document.getElementById(id); return el ? (el.value || null) : null; };
  const vb = id => { const el = document.getElementById(id); return el ? el.checked : false; };
  const vi = id => { const val = v(id); return val ? parseInt(val) : null; };
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  let body = {};

  if (activeTab === 'tasks') {
    if (!v('ff-title')) { document.getElementById('form-error').textContent = 'Title is required.'; return; }
    body = { title: cap(v('ff-title')), description: v('ff-desc'), theme_id: vi('ff-theme'), epic_id: vi('ff-epic'), owner_id: vi('ff-owner'), priority: v('ff-priority'), promise_date: v('ff-due'), status_id: vi('ff-status') || (editingId ? null : 1), is_must_achieve: vb('ff-must'), is_deep_work: vb('ff-deep') };
  } else if (activeTab === 'themes') {
    if (!v('ff-title')) { document.getElementById('form-error').textContent = 'Title is required.'; return; }
    body = { title: cap(v('ff-title')), description: v('ff-desc'), domain: v('ff-domain'), status_id: vi('ff-status') };
  } else if (activeTab === 'epics') {
    if (!v('ff-title')) { document.getElementById('form-error').textContent = 'Title is required.'; return; }
    body = { title: cap(v('ff-title')), description: v('ff-desc'), theme_id: vi('ff-theme'), owner_id: vi('ff-owner'), domain: v('ff-domain'), target_date: v('ff-target'), status_id: vi('ff-status') };
  } else if (activeTab === 'commitments') {
    if (!v('ff-desc')) { document.getElementById('form-error').textContent = 'Description is required.'; return; }
    body = { description: v('ff-desc'), person_id: vi('ff-person'), direction: v('ff-direction'), promised_date: v('ff-due'), status: v('ff-status-c') };
  } else if (activeTab === 'people') {
    if (!v('ff-title')) { document.getElementById('form-error').textContent = 'Name is required.'; return; }
    body = { full_name: cap(v('ff-title')), job_title: v('ff-job-title'), company: v('ff-company'), person_type_id: vi('ff-person-type'), work_email: v('ff-work-email'), mobile: v('ff-mobile'), relationship_note: v('ff-rel-note'), is_stakeholder: vb('ff-stakeholder'), is_active: vb('ff-active') };
  }

  const tables = { themes: 'themes', epics: 'roadmap_items', tasks: 'tasks', commitments: 'commitments', people: 'people' };
  const idKeys = { themes: 'theme_id', epics: 'roadmap_item_id', tasks: 'task_id', commitments: 'commitment_id', people: 'person_id' };

  const ALWAYS = {
    tasks: ['title','description','priority','promise_date','is_must_achieve','is_deep_work'],
    themes: ['title','description','domain'], epics: ['title','description','domain','target_date'],
    commitments: ['description','direction','promised_date','status'],
    people: ['full_name','job_title','company','person_type_id','work_email','mobile','relationship_note','is_stakeholder','is_active'],
  };

  try {
    if (editingId) {
      const keep = new Set(ALWAYS[activeTab] || []);
      const patch = Object.fromEntries(Object.entries(body).filter(([k, val]) => keep.has(k) || (val !== null && val !== undefined)));
      if (activeTab === 'tasks') { patch.is_must_achieve = vb('ff-must'); patch.is_deep_work = vb('ff-deep'); }
      await api(tables[activeTab] + '?' + idKeys[activeTab] + '=eq.' + editingId, { method: 'PATCH', body: patch, prefer: 'return=minimal' });
    } else {
      await api(tables[activeTab], { method: 'POST', body, prefer: 'return=minimal' });
    }
    closeSheet();
    // Reload ref data if the saved entity feeds into dropdowns or filter lists
    if (['people', 'themes', 'epics'].includes(activeTab)) {
      await loadRef();
    }
    loadTab();
  } catch(e) {
    document.getElementById('form-error').textContent = 'Save failed: ' + e.message;
  }
}

  }
}

function escHtmlM(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function autoResizeM(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function chatKeyDownM(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatM(); }
}

function addChatMsgM(role, text) {
  chatMessagesM.push({ role: role === 'ai' ? 'assistant' : 'user', content: text });
  const msgs = document.getElementById('chat-messages-m');
  if (!msgs) return;
  const div = document.createElement('div');
  div.className = 'chat-msg-m ' + role;
  const formatted = escHtmlM(text).replace(/\n/g, '<br>');

  div.innerHTML = '<div class="chat-msg-label-m">' + label + '</div><div class="chat-bubble-m ' + role + '">' + formatted + '</div>';

}

  const peopleLines = (ref.people || []).map(p => '  ' + p.person_id + ' = ' + p.full_name + (p.job_title ? ' (' + p.job_title + ')' : '')).join('\n');
  const themeLines  = (ref.themes  || []).map(t => '  ' + t.theme_id  + ' = ' + t.title  + (t.domain  ? ' [' + t.domain  + ']' : '')).join('\n');

  return 'You are Nick Garner\'s AI Chief of Staff. Today is ' + today + ' (' + todayISO + '). Nick\'s person_id is 1.\n\n'
    + 'PEOPLE IDs (use ONLY these integers — never a name string):\n' + peopleLines + '\n\n'
    + 'THEME IDs (use ONLY these integers — never a name string):\n' + themeLines + '\n\n'
    + 'AVAILABLE ACTIONS — append one <action> block per action:\n\n'
    + 'task_create: { title(req), owner_id(req,default 1), theme_id(opt,int), priority("High"/"Medium"/"Low"), promise_date(YYYY-MM-DD), is_must_achieve(bool), is_deep_work(bool), status_id(always 1) }\n'
    + 'task_update: { task_id(req,int), ...fields to update }\n'
    + 'task_complete: { task_id(req,int) }\n'
    + 'commitment_log: { description(req), person_id(req,int), direction("outbound"/"inbound"), promised_date(YYYY-MM-DD), status(always "Outstanding") }\n'
    + 'commitment_complete: { commitment_id(req,int) }\n'
    + 'person_create: { full_name(req), job_title(opt), company(opt), work_email(opt), person_type_id(opt,int: 1=DirectReport,2=FellowExec,3=External,4=Family,5=Me,6=Boss), relationship_note(opt), is_stakeholder(bool) }\n'
    + 'person_update: { person_id(req,int), ...fields to update }\n'
    + 'theme_create: { title(req), description(opt), domain("Business"/"Personal") }\n'
    + 'note_add: { title(req), content(req), category(opt), domain("Business"/"Personal"), valid_until(YYYY-MM-DD,opt) }\n'
    + 'debrief_complete: { event_id(opt,int), headline(req), decisions(opt), commitments(opt), actions(opt) }\n'
    + 'task_search: { query(req, title fragment) }\n'
    + 'commitment_search: { query(req, description fragment) }\n'
    + 'person_search: { query(req, name or role fragment) }\n\n'
    + 'CRITICAL RULES:\n'
    + '- Never send a string where an integer is required.\n'
    + '- Never invent IDs. Only use IDs from the lists above.\n'
    + '- Omit optional fields entirely if unknown — do not send null or empty strings for integer fields.\n'
    + '- If you cannot resolve a name to an ID, ASK Nick.\n'
    + '- Always confirm details with Nick before saving.\n'
    + '- For multiple actions (e.g. two commitments), emit one <action> block per item — never combine into one block.\n'
    + '- Do NOT say actions are complete in your message text — confirmation appears automatically after each action executes. Just describe what you are about to do.\n'
    + '- When ready to save, append EXACTLY: <action>{"type":"action_type","data":{...}}</action>\n'
    + '- Be concise — bullet points for lists.';
}

async function sendChatM(prefill) {
  const input = document.getElementById('chat-input-m');
  const text = prefill || input.value.trim();
  if (!text) return;

  if (!prefill) {
    input.value = '';
    input.style.height = 'auto';
  }

  addChatMsgM('user', text);
  document.getElementById('chat-send-m').disabled = true;
  addTypingM();

  const messages = chatMessagesM.slice(-20).map(m => ({ role: m.role, content: m.content }));

  try {
    const res = await fetch('https://ngarner.app.n8n.cloud/webhook/dashboard-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, system: buildSystemPromptM() })
    });
    const data = await res.json();
    removeTypingM();

    const reply = data.reply || data.content?.[0]?.text || 'Sorry, no response received.';
    const displayReply = reply.replace(/<action>[\s\S]*?<\/action>/g, '').trim();
    addChatMsgM('ai', displayReply);

    // Process all action blocks
    const actionMatches = [...reply.matchAll(/<action>([\s\S]*?)<\/action>/g)];
    for (const match of actionMatches) {
      try {
        const action = JSON.parse(match[1]);
        await handleChatActionM(action, text, displayReply);
      } catch(e) { console.warn('Action parse failed', e, match[1]); }
    }

  } catch(e) {
    removeTypingM();
    addChatMsgM('ai', 'Error: ' + e.message);
  }

  document.getElementById('chat-send-m').disabled = false;
}

async function injectSystemMessageM(systemText) {
  const messages = chatMessagesM.slice(-20).map(m => ({ role: m.role, content: m.content }));
  messages.push({ role: 'user', content: systemText });
  addTypingM();
  try {
    const res = await fetch('https://ngarner.app.n8n.cloud/webhook/dashboard-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, system: buildSystemPromptM() })
    });
    const data = await res.json();
    removeTypingM();
    const reply = data.reply || data.content?.[0]?.text || '';
    const displayReply = reply.replace(/<action>[\s\S]*?<\/action>/g, '').trim();
    if (displayReply) addChatMsgM('ai', displayReply);

    const actionMatches = [...reply.matchAll(/<action>([\s\S]*?)<\/action>/g)];
    for (const match of actionMatches) {
      try {
        const action = JSON.parse(match[1]);
        if (!action.type.endsWith('_search')) {
          await handleChatActionM(action, systemText, displayReply);
        }
      } catch(e) { console.warn('Action parse failed in inject', e, match[1]); }
    }
  } catch(e) {
    removeTypingM();
    addChatMsgM('ai', '✗ Error: ' + e.message);
  }
}

async function logChatActionM(actionType, actionData, resultId, resultTable, status, errorMsg, userMsg, claudeResp) {
  try {
    await api('chat_actions', {
      method: 'POST',
      body: { session_id: window._chatSessionIdM, chat_channel: 'mobile', action_type: actionType, action_data: actionData, result_id: resultId || null, result_table: resultTable || null, status: status || 'success', error_message: errorMsg || null, user_message: userMsg || null, claude_response: claudeResp || null },
      prefer: 'return=minimal'
    });
  } catch(e) { console.warn('Failed to log chat action:', e.message); }
}

async function handleChatActionM(action, userMsg, claudeResp) {
  const t = action.type;
  const d = action.data || {};

  if (t === 'task_create') {
    try {
      const res = await api('tasks?select=task_id', { method: 'POST', body: { ...d, creation_source: 'Dashboard Chat', status_id: d.status_id || 1 }, prefer: 'return=representation' });
      const resultId = Array.isArray(res) ? res[0]?.task_id : res?.task_id;
      addChatMsgM('ai', '✓ Task created: "' + d.title + '"');
      await logChatActionM(t, d, resultId, 'tasks', 'success', null, userMsg, claudeResp);
      if (activeTab === 'tasks') loadTab();
    } catch(e) {
      addChatMsgM('ai', '✗ Failed to create task: ' + e.message);
      await logChatActionM(t, d, null, 'tasks', 'failed', e.message, userMsg, claudeResp);
    }
  }

  else if (t === 'task_update' && d.task_id) {
    try {
      const { task_id, ...fields } = d;
      await api('tasks?task_id=eq.' + task_id, { method: 'PATCH', body: fields, prefer: 'return=minimal' });
      addChatMsgM('ai', '✓ Task updated.');
      await logChatActionM(t, d, task_id, 'tasks', 'success', null, userMsg, claudeResp);
      if (activeTab === 'tasks') loadTab();
    } catch(e) {
      addChatMsgM('ai', '✗ Failed to update task: ' + e.message);
      await logChatActionM(t, d, null, 'tasks', 'failed', e.message, userMsg, claudeResp);
    }
  }

  else if (t === 'task_complete' && d.task_id) {
    try {
      const doneStatus = (ref.statuses || []).find(s => s.status_label === 'Done' || s.status_label === 'Complete');
      const statusId = doneStatus ? doneStatus.status_id : 3;
      await api('tasks?task_id=eq.' + d.task_id, { method: 'PATCH', body: { status_id: statusId }, prefer: 'return=minimal' });
      addChatMsgM('ai', '✓ Task marked complete.');
      await logChatActionM(t, d, d.task_id, 'tasks', 'success', null, userMsg, claudeResp);
      if (activeTab === 'tasks') loadTab();
    } catch(e) {
      addChatMsgM('ai', '✗ Failed to complete task: ' + e.message);
      await logChatActionM(t, d, null, 'tasks', 'failed', e.message, userMsg, claudeResp);
    }
  }

  else if (t === 'commitment_log') {
    try {
      const res = await api('commitments?select=commitment_id', { method: 'POST', body: { ...d, status: d.status || 'Outstanding' }, prefer: 'return=representation' });
      const resultId = Array.isArray(res) ? res[0]?.commitment_id : res?.commitment_id;
      addChatMsgM('ai', '✓ Commitment logged.');
      await logChatActionM(t, d, resultId, 'commitments', 'success', null, userMsg, claudeResp);
      if (activeTab === 'commitments') loadTab();
    } catch(e) {
      addChatMsgM('ai', '✗ Failed to log commitment: ' + e.message);
      await logChatActionM(t, d, null, 'commitments', 'failed', e.message, userMsg, claudeResp);
    }
  }

  else if (t === 'commitment_complete' && d.commitment_id) {
    try {
      await api('commitments?commitment_id=eq.' + d.commitment_id, { method: 'PATCH', body: { status: 'Delivered' }, prefer: 'return=minimal' });
      addChatMsgM('ai', '✓ Commitment marked delivered.');
      await logChatActionM(t, d, d.commitment_id, 'commitments', 'success', null, userMsg, claudeResp);
      if (activeTab === 'commitments') loadTab();
    } catch(e) {
      addChatMsgM('ai', '✗ Failed to update commitment: ' + e.message);
      await logChatActionM(t, d, null, 'commitments', 'failed', e.message, userMsg, claudeResp);
    }
  }

  else if (t === 'person_create' && d.full_name) {
    try {
      const res = await api('people?select=person_id', { method: 'POST', body: { ...d, is_active: true }, prefer: 'return=representation' });
      const resultId = Array.isArray(res) ? res[0]?.person_id : res?.person_id;
      addChatMsgM('ai', '✓ Person added: ' + d.full_name);
      await refreshPeople();
      await logChatActionM(t, d, resultId, 'people', 'success', null, userMsg, claudeResp);
      if (activeTab === 'people') loadTab();
    } catch(e) {
      addChatMsgM('ai', '✗ Failed to add person: ' + e.message);
      await logChatActionM(t, d, null, 'people', 'failed', e.message, userMsg, claudeResp);
    }
  }

  else if (t === 'person_update' && d.person_id) {
    try {
      const { person_id, ...fields } = d;
      await api('people?person_id=eq.' + person_id, { method: 'PATCH', body: fields, prefer: 'return=minimal' });
      addChatMsgM('ai', '✓ Person updated.');
      await refreshPeople();
      await logChatActionM(t, d, person_id, 'people', 'success', null, userMsg, claudeResp);
      if (activeTab === 'people') loadTab();
    } catch(e) {
      addChatMsgM('ai', '✗ Failed to update person: ' + e.message);
      await logChatActionM(t, d, null, 'people', 'failed', e.message, userMsg, claudeResp);
    }
  }

  else if (t === 'theme_create' && d.title) {
    try {
      const res = await api('themes?select=theme_id', { method: 'POST', body: d, prefer: 'return=representation' });
      const resultId = Array.isArray(res) ? res[0]?.theme_id : res?.theme_id;
      addChatMsgM('ai', '✓ Theme created: "' + d.title + '"');
      const updated = await api('themes?select=theme_id,title,domain&order=title.asc');
      ref.themes = updated || ref.themes;
      await logChatActionM(t, d, resultId, 'themes', 'success', null, userMsg, claudeResp);
      if (activeTab === 'themes') loadTab();
    } catch(e) {
      addChatMsgM('ai', '✗ Failed to create theme: ' + e.message);
      await logChatActionM(t, d, null, 'themes', 'failed', e.message, userMsg, claudeResp);
    }
  }

  else if (t === 'note_add' && d.title && d.content) {
    try {
      await api('context_documents', { method: 'POST', body: { title: d.title, content: d.content, category: d.category || null, domain: d.domain || null, valid_until: d.valid_until || null }, prefer: 'return=minimal' });
      addChatMsgM('ai', '✓ Note saved: "' + d.title + '"');
      await logChatActionM(t, d, null, 'context_documents', 'success', null, userMsg, claudeResp);
    } catch(e) {
      addChatMsgM('ai', '✗ Failed to save note: ' + e.message);
      await logChatActionM(t, d, null, 'context_documents', 'failed', e.message, userMsg, claudeResp);
    }
  }

  else if (t === 'debrief_complete' && d.headline) {
    try {
      const body = { pre_brief: null, summary: d.headline, outcomes: d.decisions || null, follow_ups: d.actions || null };
      if (d.event_id) body.event_id = d.event_id;
      const res = await api('meeting_records?select=meeting_record_id', { method: 'POST', body, prefer: 'return=representation' });
      const resultId = Array.isArray(res) ? res[0]?.meeting_record_id : res?.meeting_record_id;
      if (d.event_id) {
        await api('calendar_events?event_id=eq.' + d.event_id, { method: 'PATCH', body: { debrief_sent: true }, prefer: 'return=minimal' });
      }
      addChatMsgM('ai', '✓ Debrief saved.');
      await logChatActionM(t, d, resultId, 'meeting_records', 'success', null, userMsg, claudeResp);
    } catch(e) {
      addChatMsgM('ai', '✗ Failed to save debrief: ' + e.message);
      await logChatActionM(t, d, null, 'meeting_records', 'failed', e.message, userMsg, claudeResp);
    }
  }

  else if (t === 'task_search') {
    try {
      const results = await api('tasks?select=task_id,title,status_id,statuses(status_label)&title=ilike.*' + encodeURIComponent(d.query) + '*&limit=5');
      const summary = results && results.length
        ? 'SYSTEM: task_search results for "' + d.query + '":\n' + results.map(r => '  task_id=' + r.task_id + ' — ' + r.title + ' [' + (r.statuses?.status_label || '?') + ']').join('\n') + '\nProceed with the action now.'
        : 'SYSTEM: task_search found no matches for "' + d.query + '". Ask Nick to clarify.';
      await injectSystemMessageM(summary);
    } catch(e) { addChatMsgM('ai', '✗ Search failed: ' + e.message); }
  }

  else if (t === 'commitment_search') {
    try {
      const results = await api('commitments?select=commitment_id,description,status&description=ilike.*' + encodeURIComponent(d.query) + '*&limit=5');
      const summary = results && results.length
        ? 'SYSTEM: commitment_search results for "' + d.query + '":\n' + results.map(r => '  commitment_id=' + r.commitment_id + ' — ' + r.description + ' [' + r.status + ']').join('\n') + '\nProceed with the action now.'
        : 'SYSTEM: commitment_search found no matches for "' + d.query + '". Ask Nick to clarify.';
      await injectSystemMessageM(summary);
    } catch(e) { addChatMsgM('ai', '✗ Search failed: ' + e.message); }
  }

  else if (t === 'person_search') {
    try {
      const results = await api('people?select=person_id,full_name,job_title&or=(full_name.ilike.*' + encodeURIComponent(d.query) + '*,job_title.ilike.*' + encodeURIComponent(d.query) + '*)&limit=5');
      const summary = results && results.length
        ? 'SYSTEM: person_search results for "' + d.query + '":\n' + results.map(r => '  person_id=' + r.person_id + ' — ' + r.full_name + (r.job_title ? ' (' + r.job_title + ')' : '')).join('\n') + '\nProceed with the action now.'
        : 'SYSTEM: person_search found no matches for "' + d.query + '". Ask Nick if they should be added.';
      await injectSystemMessageM(summary);
    } catch(e) { addChatMsgM('ai', '✗ Search failed: ' + e.message); }
  }
}
